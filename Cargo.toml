[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-policy",
    "crates/aegis-redact",
    "crates/aegis-store",
    "crates/aegis-transport",
    "crates/aegis-mux",
    "crates/aegis-tui",
    "crates/aegis-cli",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/its-zain-dev/aegis"
description = "Single-binary Rust AI Agent Gateway & MCP Firewall"
keywords = ["mcp", "ai", "gateway", "firewall", "security"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[workspace.dependencies]
# Internal crates
aegis-core = { path = "crates/aegis-core", version = "0.9.0" }
aegis-policy = { path = "crates/aegis-policy", version = "0.9.0" }
aegis-redact = { path = "crates/aegis-redact", version = "0.9.0" }
aegis-store = { path = "crates/aegis-store", version = "0.9.0" }
aegis-transport = { path = "crates/aegis-transport", version = "0.9.0" }
aegis-mux = { path = "crates/aegis-mux", version = "0.9.0" }
aegis-tui = { path = "crates/aegis-tui", version = "0.9.0" }

# Async runtime & utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "process", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmp-serde = "1"

# Errors & logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Security & redaction
aho-corasick = "1"
regex = "1"

# Pure-Rust storage, hashing & compression
blake3 = { version = "1", default-features = false, features = ["std"] }
crc32fast = "1"
lz4_flex = "0.11"

# Networking (Streamable HTTP + Legacy SSE)
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }

# CLI & TUI
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
dirs = "6"

# Testing
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
